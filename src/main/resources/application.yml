spring:
  application:
    name: projeto.hugo.terapia
  datasource:
    url: jdbc:postgresql://localhost:5433/mydatabase
    username: myuser
    password: mypassword
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  configuration:
    host-front-end: http://localhost:3000
    host-back-end: http://localhost:8080

  cloudfare:
    access-key: ${ACCESS_KEY_CLOUDFARE}
    secret-key: ${SECRET_KEY_CLOUDFARE}
    account-id: ${ACCOUNT_ID_CLOUDFARE}
    r2-region: ${R2_REGION_CLOUDFARE}
    bucket-profile-photo-name: profile-photo
    bucket-professional-photo-name: professional-photo